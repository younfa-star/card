<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오하비 | 시스템 프로그래머 웹 명함</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
  <!-- 배경 데코레이션 효과 -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="matrix-grid"></div>

  <main class="card-container">
    <div class="business-card" id="businessCard">
      <!-- 카드 상단 상태바 -->
      <header class="card-header">
        <div class="status-badge">
          <span class="status-dot"></span>
          <span class="status-text">Available for System Dev</span>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="테마 전환" title="라이트/다크 모드 변경">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </header>

      <!-- 프로필 캐릭터 섹션 -->
      <section class="avatar-section">
        <div class="avatar-wrapper">
          <div class="avatar-ring"></div>
          <!-- 정교한 남성 개발자 캐릭터 SVG -->
          <svg class="character-svg" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#1e293b" />
                <stop offset="100%" stop-color="#0f172a" />
              </linearGradient>
              <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffdfba" />
                <stop offset="100%" stop-color="#f8c89c" />
              </linearGradient>
              <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#334155" />
                <stop offset="100%" stop-color="#1e293b" />
              </linearGradient>
              <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0284c7" />
                <stop offset="100%" stop-color="#0369a1" />
              </linearGradient>
              <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
                <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
              </linearGradient>
              <filter id="avatarShadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
              </filter>
            </defs>

            <!-- 원형 배경 -->
            <circle cx="120" cy="120" r="110" fill="url(#bgGrad)" />

            <!-- 배경 코드 및 서버 그래픽 -->
            <g opacity="0.2" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round">
              <path d="M 28 85 L 45 85 M 28 95 L 60 95 M 28 105 L 50 105" />
              <path d="M 195 85 L 212 85 M 180 95 L 212 95 M 190 105 L 212 105" />
            </g>

            <!-- 헤드셋 밴드 (뒤) -->
            <path d="M 68 115 C 68 55 172 55 172 115" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" />

            <!-- 목 & 티셔츠 기본 -->
            <rect x="105" y="145" width="30" height="35" rx="5" fill="#f8c89c" />
            <path d="M 105 160 Q 120 172 135 160 Z" fill="#e2b184" opacity="0.6" />

            <!-- 옷 (후드집업 / 개발자 룩) -->
            <path d="M 60 215 C 60 175 90 165 120 165 C 150 165 180 175 180 215 C 180 225 60 225 60 215 Z" fill="url(#hoodieGrad)" filter="url(#avatarShadow)" />
            <!-- 옷 이너 셔츠 & 지퍼 라인 -->
            <path d="M 112 165 L 120 190 L 128 165" fill="#0f172a" />
            <line x1="120" y1="190" x2="120" y2="225" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="2 3" />
            <!-- 후드 끈 -->
            <path d="M 108 178 Q 106 200 105 208" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" fill="none"/>
            <path d="M 132 178 Q 134 200 135 208" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" fill="none"/>

            <!-- 얼굴 윤곽 -->
            <path d="M 80 100 C 80 145 100 165 120 165 C 140 165 160 145 160 100 C 160 70 80 70 80 100 Z" fill="url(#skinGrad)" filter="url(#avatarShadow)" />

            <!-- 귀 -->
            <circle cx="78" cy="118" r="9" fill="#f8c89c" />
            <circle cx="162" cy="118" r="9" fill="#f8c89c" />

            <!-- 헤어스타일 (뒷머리/볼륨) -->
            <path d="M 72 98 C 68 55 172 55 168 98 C 160 72 140 65 120 66 C 100 65 80 75 72 98 Z" fill="url(#hairGrad)" />

            <!-- 앞머리 (자연스러운 댄디 컷) -->
            <path d="M 76 92 C 90 85 105 92 118 84 C 132 78 148 85 164 92 C 160 82 150 72 135 70 C 115 67 95 72 76 92 Z" fill="#1e293b" />
            <path d="M 95 86 C 105 98 115 95 125 87" fill="#334155" />

            <!-- 눈썹 (지적이고 또렷한) -->
            <path d="M 92 104 Q 104 100 112 105" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
            <path d="M 128 105 Q 136 100 148 104" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />

            <!-- 눈 (친근한 눈빛 + 깜빡임 애니메이션 타겟) -->
            <g class="character-eyes">
              <circle cx="103" cy="116" r="4.5" fill="#0f172a" />
              <circle cx="104.5" cy="114.5" r="1.5" fill="#ffffff" />
              <circle cx="137" cy="116" r="4.5" fill="#0f172a" />
              <circle cx="138.5" cy="114.5" r="1.5" fill="#ffffff" />
            </g>

            <!-- 안경 (스마트한 시스템 개발자 느낌) -->
            <g stroke="#38bdf8" stroke-width="2.5" fill="none">
              <!-- 왼쪽 렌즈 테 -->
              <rect x="91" y="108" width="24" height="18" rx="6" fill="url(#glassGrad)" />
              <!-- 오른쪽 렌즈 테 -->
              <rect x="125" y="108" width="24" height="18" rx="6" fill="url(#glassGrad)" />
              <!-- 안경 브릿지 -->
              <line x1="115" y1="115" x2="125" y2="115" stroke-linecap="round" />
              <!-- 안경 다리 -->
              <line x1="91" y1="114" x2="78" y2="112" stroke-linecap="round" />
              <line x1="149" y1="114" x2="162" y2="112" stroke-linecap="round" />
              <!-- 렌즈 반사광 -->
              <line x1="94" y1="111" x2="100" y2="122" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
              <line x1="128" y1="111" x2="134" y2="122" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
            </g>

            <!-- 코 & 미소 -->
            <path d="M 119 122 Q 120 128 117 129" stroke="#d99966" stroke-width="2" stroke-linecap="round" fill="none" />
            <path d="M 112 138 Q 120 144 128 138" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" fill="none" />

            <!-- 볼 터치 (친근함 강조) -->
            <ellipse cx="91" cy="128" rx="5" ry="2.5" fill="#f43f5e" opacity="0.25" />
            <ellipse cx="149" cy="128" rx="5" ry="2.5" fill="#f43f5e" opacity="0.25" />

            <!-- 헤드셋 유닛 (귀 부분) -->
            <rect x="68" y="106" width="10" height="24" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
            <rect x="162" y="106" width="10" height="24" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
          </svg>
        </div>
      </section>

      <!-- 프로필 메인 정보 -->
      <section class="info-section">
        <div class="name-badge-wrap">
          <h1 class="user-name">오하비</h1>
          <span class="user-name-en">OH HABI</span>
        </div>
        <div class="role-wrap">
          <span class="code-bracket">&lt;</span>
          <h2 class="user-role">시스템프로그래머</h2>
          <span class="code-bracket">/&gt;</span>
        </div>

        <p class="user-bio">
          "하드웨어와 OS의 깊은 곳에서 고성능·무결점 시스템을 설계하고 최적화합니다."
        </p>

        <!-- 기술 스택 / 관심 분야 칩 -->
        <div class="tech-tags">
          <span class="tech-tag">C/C++</span>
          <span class="tech-tag">Linux Kernel</span>
          <span class="tech-tag">Embedded</span>
          <span class="tech-tag">Optimization</span>
          <span class="tech-tag">Architecture</span>
        </div>
      </section>

      <!-- 구분선 -->
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-icon">⚡</span>
        <span class="divider-line"></span>
      </div>

      <!-- 연락처 및 상세 정보 링크 -->
      <section class="contact-section">
        <!-- 이메일 아이템 -->
        <div class="contact-item" id="emailItem">
          <div class="contact-icon email-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
          </div>
          <div class="contact-details">
            <span class="contact-label">Email</span>
            <a href="mailto:o-habi@gmail.com" class="contact-value" id="emailVal">o-habi@gmail.com</a>
          </div>
          <button class="copy-btn" data-copy="o-habi@gmail.com" aria-label="이메일 복사" title="복사">
            <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="tooltip">복사</span>
          </button>
        </div>

        <!-- 전화번호 아이템 -->
        <div class="contact-item" id="phoneItem">
          <div class="contact-icon phone-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </div>
          <div class="contact-details">
            <span class="contact-label">Mobile</span>
            <a href="tel:01012345678" class="contact-value" id="phoneVal">010-1234-5678</a>
          </div>
          <button class="copy-btn" data-copy="010-1234-5678" aria-label="전화번호 복사" title="복사">
            <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="tooltip">복사</span>
          </button>
        </div>
      </section>

      <!-- 카드 푸터 액션 버튼들 -->
      <footer class="card-footer">
        <button class="btn btn-primary" id="saveContactBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span>연락처 저장 (.vcf)</span>
        </button>

        <button class="btn btn-secondary" id="shareCardBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          <span>명함 공유</span>
        </button>
      </footer>
    </div>
  </main>

  <!-- 토스트 알림 메시지 -->
  <div class="toast" id="toast">복사되었습니다!</div>

  <script src="script.js"></script>
</body>
</html>
